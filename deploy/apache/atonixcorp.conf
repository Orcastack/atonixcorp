<VirtualHost *:80>
    ServerName atonixcorp.com
    ServerAlias www.atonixcorp.com
    ServerAlias api.atonixcorp.com
    Redirect permanent / https://atonixcorp.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName www.atonixcorp.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/atonixcorp.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/atonixcorp.com/privkey.pem
    Redirect permanent / https://atonixcorp.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName atonixcorp.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/atonixcorp.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/atonixcorp.com/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>

<VirtualHost *:443>
    ServerName api.atonixcorp.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/api.atonixcorp.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.atonixcorp.com/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
