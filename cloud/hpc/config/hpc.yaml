service:
  name: "atonixcorp-hpc"
  port: 8080

auth:
  jwt_signing_key: "super-secret-key"

scheduler:
  default_backend: "slurm"   # slurm | k8s
  slurm:
    enabled: true
  k8s:
    enabled: true
    namespace: "hpc-jobs"

storage:
  s3:
    endpoint: "minio:9000"
    bucket: "datasets"
    access_key: "atonix"
    secret_key: "atonix-secret"
    secure: false

database:
  postgres:
    host: "postgres"
    port: 5432
    user: "atonix"
    password: "atonix-pass"
    dbname: "hpc"

metrics:
  port: 9090

cluster:
  discovery_interval: "30s"
  health_interval: "20s"
