# AtonixCorp Cloud DBaaS Environment Configuration
environment: "production"

default_region: "af-south-1"

regions:
  - "af-south-1"
  - "us-east-1"
  - "us-west-2"
  - "eu-central-1"
  - "ap-southeast-1"


database_defaults:
  network_id: "default-db-network"
  security_group_id: "default-db-sg"
  image_id: "db-image-postgres-16"
  backup_bucket: "atonix-backups"

controller:
  reconcile_interval_seconds: 30

logging:
  level: "info"


