# Default cluster (your main OpenStack deployment)
default:
  auth:
    auth_url: "https://openstack.atonixcorp.cloud:5000/v3"
    username: "admin"
    password: "CHANGE_ME"
    domain: "default"
    project_id: "PROJECT_ID_HERE"

  endpoints:
    compute: "https://openstack.atonixcorp.cloud:8774/v2.1"
    network: "https://openstack.atonixcorp.cloud:9696/v2.0"
    volume:  "https://openstack.atonixcorp.cloud:8776/v3"


